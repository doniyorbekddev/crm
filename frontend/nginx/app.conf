# =====================================================================
# Frontend konteyneri ichidagi Nginx: statik fayllar + SPA marshrutlari.
# API so‘rovlari backend konteyneriga uzatiladi (bitta domen — CORS shart emas).
# =====================================================================

upstream crm_backend {
    server backend:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Yuklanadigan fayl hajmi (hujjatlar uchun zaxira)
    client_max_body_size 10m;

    # Konteyner sog‘ligini tekshirish
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Hashli fayl nomlari — uzoq muddatli kesh
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html hech qachon keshlanmaydi — yangi versiya darhol ko‘rinishi uchun
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API — backendga
    location /api/ {
        proxy_pass http://crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        # Hisobot eksporti kabi katta javoblar buferlanmasin
        proxy_buffering off;
    }

    # SPA: har qanday boshqa manzil index.html ga tushadi (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Statik tomondagi himoya sarlavhalari (API sarlavhalarini backend o‘zi qo‘yadi)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
}
