# =====================================================================
# Frontend konteyneri ichidagi Nginx: statik fayllar + SPA marshrutlari.
# API so‘rovlari backend konteyneriga uzatiladi (bitta domen — CORS shart emas).
# =====================================================================

upstream crm_backend {
    server backend:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Yuklanadigan fayl hajmi (hujjatlar uchun zaxira)
    client_max_body_size 10m;

    # ---------------------------------------------------------------------
    # Haqiqiy mijoz IP manzili.
    #
    # Odatiy production zanjiri: mijoz → host Nginx → shu Nginx → backend. Host Nginx
    # `X-Forwarded-For: <mijoz>` yuboradi, lekin bizga ulanish Docker shlyuzidan keladi. Agar shu
    # yerda manzil aniqlanmasa, backend (TRUST_PROXY=1) zanjirning oxirgi yozuvini — shlyuzni —
    # mijoz deb oladi: hamma foydalanuvchi bitta IP bo'lib qoladi (rate limit va login bloklash
    # butun markazga umumiy, auditda IP bir xil).
    #
    # Yechim: ulanish ichki manbadan (loopback, Docker yoki xususiy tarmoq — ya'ni host Nginx) kelsa,
    # mijoz manzili sifatida X-Forwarded-For ning OXIRGI yozuvi olinadi: uni host Nginx o'zi qo'shgan
    # (`$proxy_add_x_forwarded_for`), mijoz yuborgan soxta qiymatlar esa undan oldinda qoladi va
    # e'tiborga olinmaydi. Shuning uchun `real_ip_recursive` ataylab O'CHIQ: yoqilsa, xususiy tarmoqdan
    # (masalan ofis LAN) kelgan mijozning o'zi "ishonchli proxy" deb olinib, soxta manzil qabul qilinardi.
    #
    # Ulanish to'g'ridan-to'g'ri internetdan kelsa (HTTP_BIND=0.0.0.0, host Nginx'siz), manba ishonchli
    # emas — sarlavha umuman o'qilmaydi. Cheklov: host Nginx'siz rejimda xususiy tarmoqdagi mijoz
    # sarlavhani soxtalashtira oladi — production'da host Nginx (yoki boshqa ishonchli proxy) ishlating.
    # ---------------------------------------------------------------------
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from ::1;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Konteyner sog‘ligini tekshirish
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Hashli fayl nomlari — uzoq muddatli kesh
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html hech qachon keshlanmaydi — yangi versiya darhol ko‘rinishi uchun
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API — backendga
    location /api/ {
        proxy_pass http://crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Backendga bitta, yuqorida aniqlangan manzil boradi (zanjir emas) — shunda TRUST_PROXY=1
        # host Nginx bor-yo'qligidan qat'i nazar to'g'ri ishlaydi
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        # Hisobot eksporti kabi katta javoblar buferlanmasin
        proxy_buffering off;
    }

    # SPA: har qanday boshqa manzil index.html ga tushadi (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Statik tomondagi himoya sarlavhalari (API sarlavhalarini backend o‘zi qo‘yadi)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
}
