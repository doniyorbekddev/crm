name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_ci_password
          POSTGRES_DB: crm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm -d crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Integratsion testlar shu bazani ishlatadi (har test faylida tozalanadi)
      TEST_DATABASE_URL: postgresql://crm:crm_ci_password@localhost:5432/crm_test?schema=public
      DATABASE_URL: postgresql://crm:crm_ci_password@localhost:5432/crm_test?schema=public
      JWT_SECRET: ci-access-secret-0123456789-abcdefghijklmnop
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789-abcdefghijklmnop
      CLIENT_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (unit + integratsion)
        run: npm test

      - name: Production build
        run: npm run build
