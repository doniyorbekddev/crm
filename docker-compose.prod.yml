# =====================================================================
# Sales CRM — production stack: PostgreSQL + backend + frontend (Nginx).
#
# Ishga tushirish:
#   cp .env.production.example .env.production
#   # .env.production ni to‘ldiring (parollar, JWT kalitlari, domen)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Migratsiyalar backend ishga tushishidan oldin alohida servis orqali bajariladi.
# =====================================================================
name: sales-crm-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Qidiruv uchun pg_trgm kengaytmasi migratsiyada yoqiladi
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Baza tashqi tarmoqqa umuman ochilmaydi — faqat ichki tarmoq
    networks: [crm]

  # Bir martalik servis: migratsiyalarni qo‘llaydi va tugaydi
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      # Prisma CLI faqat shu bosqichda bor (yakuniy image’da yo‘q)
      target: migrator
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [crm]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN_DAYS: ${JWT_REFRESH_EXPIRES_IN_DAYS:-7}
      CLIENT_URL: ${CLIENT_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      APP_UTC_OFFSET_MINUTES: ${APP_UTC_OFFSET_MINUTES:-300}
      # Nginx orqasida ishlaydi — haqiqiy IP X-Forwarded-For dan olinadi
      TRUST_PROXY: 1
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-800}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      # Ilova SMTP_PASS nomini o'qiydi (backend/src/config/env.ts), .env.production'da esa
      # SMTP_PASSWORD deb yoziladi — shu yerda moslashtiriladi
      SMTP_PASS: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Sales CRM <no-reply@localhost>}
      PASSWORD_RESET_EXPIRES_MINUTES: ${PASSWORD_RESET_EXPIRES_MINUTES:-30}
      # --- Telegram bot (ixtiyoriy; token bo'lmasa xabarlar yuborilmaydi) ---
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # Productionda har doim webhook — polling faqat ishlab chiqish uchun
      TELEGRAM_POLLING: "false"
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
    # Cheklar va hujjatlar konteyner qayta yaratilganda yo'qolmasligi uchun
    volumes:
      - crm_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [crm]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Bitta domen: /api backendga proxy qilinadi
        VITE_API_URL: /api
        VITE_APP_NAME: ${VITE_APP_NAME:-Sales CRM}
    restart: unless-stopped
    ports:
      # Docker publish qilgan port UFW'ni chetlab o'tadi, shuning uchun standart holatda
      # faqat localhost: tashqi HTTPS ni host Nginx bajaradi (deploy/nginx/crm.conf.example).
      # Host Nginx'siz, to'g'ridan-to'g'ri IP orqali sinash uchun: HTTP_BIND=0.0.0.0
      - '${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80'
    depends_on:
      - backend
    networks: [crm]

volumes:
  crm_pgdata:
  crm_uploads:

networks:
  crm:
    driver: bridge
