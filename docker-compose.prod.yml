# =====================================================================
# Sales CRM — production stack: PostgreSQL + backend + frontend (Nginx).
#
# Ishga tushirish:
#   cp .env.production.example .env.production
#   # .env.production ni to‘ldiring (parollar, JWT kalitlari, domen)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Migratsiyalar backend ishga tushishidan oldin alohida servis orqali bajariladi.
# =====================================================================
name: sales-crm-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Qidiruv uchun pg_trgm kengaytmasi migratsiyada yoqiladi
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Baza tashqi tarmoqqa umuman ochilmaydi — faqat ichki tarmoq
    networks: [crm]

  # Bir martalik servis: migratsiyalarni qo‘llaydi va tugaydi
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      # Prisma CLI faqat shu bosqichda bor (yakuniy image’da yo‘q)
      target: migrator
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [crm]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN_DAYS: ${JWT_REFRESH_EXPIRES_IN_DAYS:-7}
      CLIENT_URL: ${CLIENT_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      APP_UTC_OFFSET_MINUTES: ${APP_UTC_OFFSET_MINUTES:-300}
      # Nginx orqasida ishlaydi — haqiqiy IP X-Forwarded-For dan olinadi
      TRUST_PROXY: 1
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-800}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Sales CRM <no-reply@localhost>}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [crm]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Bitta domen: /api backendga proxy qilinadi
        VITE_API_URL: /api
        VITE_APP_NAME: ${VITE_APP_NAME:-Sales CRM}
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8080}:80'
    depends_on:
      - backend
    networks: [crm]

volumes:
  crm_pgdata:

networks:
  crm:
    driver: bridge
